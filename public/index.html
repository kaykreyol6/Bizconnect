<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="BizConnect — connect with businesses, gigs and bargains worldwide.">
<meta name="theme-color" content="#CC0000">
<title>BizConnect — Global Business & Social Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23CC0000'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Georgia' font-weight='bold'%3EB%3C/text%3E%3C/svg%3E">
<script type="module" src="/js/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<nav class="topnav" aria-label="Top">
  <div class="row">
    <button class="menu-toggle" data-action="toggle-menu" aria-label="Open menu" hidden>☰</button>
    <a class="logo" href="#/feed">Biz<span>Connect</span></a>
  </div>
  <a class="nav-location" id="navLocation" href="#/settings" hidden>📍 <span></span></a>
  <div class="nav-right" id="navRight" hidden>
    <a class="nav-lang" id="navLang" href="#/settings">🌐 <span>EN</span></a>
    <button class="nav-btn hide-sm" data-action="open-compliance">📋 Sign Regulations</button>
    <div class="dropdown">
      <button class="nav-btn" data-action="toggle-dropdown" aria-haspopup="true" aria-expanded="false">My Profile ▾</button>
      <div class="dropdown-menu" id="profileMenu" hidden>
        <a href="#/profile/me">👤 View profile</a>
        <a href="#/settings">⚙️ Settings</a>
        <a href="#/contracts">📄 Contracts</a>
        <button data-action="logout">🚪 Log out</button>
      </div>
    </div>
  </div>
</nav>

<div id="authRoot" hidden></div>

<div class="layout" id="appRoot" hidden>
  <aside class="sidebar-left" id="sidebarLeft">
    <div class="profile-card" id="profileCard"></div>
    <nav class="nav-menu" id="navMenu" aria-label="Main">
      <a class="nav-item" href="#/feed" data-route="feed"><span class="nav-icon">🏠</span> Feed</a>
      <a class="nav-item" href="#/businesses" data-route="businesses"><span class="nav-icon">🏢</span> Businesses</a>
      <a class="nav-item" href="#/gigs" data-route="gigs"><span class="nav-icon">💼</span> Gigs</a>
      <a class="nav-item" href="#/bargains" data-route="bargains"><span class="nav-icon">🏷️</span> Bargains</a>
      <a class="nav-item" href="#/contracts" data-route="contracts"><span class="nav-icon">📄</span> Contracts</a>
      <a class="nav-item" href="#/messages" data-route="messages"><span class="nav-icon">💬</span> Messages <span class="nav-badge" id="unreadBadge" hidden></span></a>
      <a class="nav-item" href="#/regulations" data-route="regulations"><span class="nav-icon">⚖️</span> Regulations</a>
      <a class="nav-item" href="#/settings" data-route="settings"><span class="nav-icon">♿</span> Settings &amp; Accessibility</a>
    </nav>
  </aside>

  <main class="main-feed" id="main" tabindex="-1"></main>

  <aside class="sidebar-right" id="sidebarRight"></aside>
</div>

<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:24px">BizConnect requires JavaScript.</p></noscript>
</body>
</html>
