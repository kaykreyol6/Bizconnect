# Production-like local stack: Postgres + one-off migration job + 2 stateless
# API replicas behind an nginx load balancer.
#   docker compose up --build            → http://localhost:8080
#   docker compose run --rm migrate npm run seed   (optional demo data)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bizconnect
      POSTGRES_PASSWORD: bizconnect
      POSTGRES_DB: bizconnect
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizconnect"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["node", "server/db/cli.js", "migrate"]
    environment: &appenv
      NODE_ENV: production
      DATABASE_URL: postgres://bizconnect:bizconnect@db:5432/bizconnect
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-of-at-least-32-chars}
      DB_POOL_MAX: "10"
      TRUST_PROXY: "1"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment: *appenv
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 2
    restart: unless-stopped

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
